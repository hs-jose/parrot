[package]
name = "parrot"
version.workspace = true
edition.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/parrot-protocol",
    "crates/parrot-config",
    "crates/parrot-transport",
    "crates/parrot-core",
    "crates/parrot-providers",
    "crates/parrot-tools",
    "crates/parrot-hooks",
    "crates/parrot-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
dirs = "6"
tokio-tungstenite = "0.26"
futures-util = "0.3"
async-stream = "0.3"
glob = "0.3"
regex = "1"
rustyline = "15"
ratatui = "0.30"
crossterm = "0.29"
ratatui-textarea = "0.9"

[[bin]]
name = "parrotd"
path = "src/daemon/main.rs"

[[bin]]
name = "parrot"
path = "src/cli/main.rs"

[[test]]
name = "e2e"
path = "tests/integration/e2e_test.rs"

[[test]]
name = "phase15"
path = "tests/integration/phase15_test.rs"

[[test]]
name = "cassette"
path = "tests/cassette_test.rs"

[dev-dependencies]
parrot-daemon    = { path = "crates/parrot-daemon" }
parrot-core      = { path = "crates/parrot-core" }
parrot-config    = { path = "crates/parrot-config" }
parrot-protocol  = { path = "crates/parrot-protocol" }
parrot-transport = { path = "crates/parrot-transport" }
parrot-hooks     = { path = "crates/parrot-hooks" }
parrot-tools     = { path = "crates/parrot-tools" }
serde            = { workspace = true }
serde_json       = { workspace = true }
async-trait      = { workspace = true }
tokio            = { workspace = true }
tempfile = "3"

[dependencies]
# parrotd binary
parrot-daemon       = { path = "crates/parrot-daemon" }
parrot-config       = { path = "crates/parrot-config" }
tracing-subscriber  = { workspace = true }

# parrot CLI binary
parrot-protocol     = { path = "crates/parrot-protocol" }
parrot-transport    = { path = "crates/parrot-transport" }
serde_json          = { workspace = true }
tokio               = { workspace = true }
clap                = { workspace = true }
rustyline           = { workspace = true }
uuid                = { workspace = true }
ratatui             = { workspace = true, features = ["unstable-rendered-line-info"] }
crossterm           = { workspace = true }
ratatui-textarea    = { workspace = true }
tui-markdown       = { version = "0.3", default-features = false }
chrono              = { workspace = true }
dirs                = { workspace = true }
unicode-width       = "0.2"
