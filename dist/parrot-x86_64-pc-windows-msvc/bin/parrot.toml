[daemon]
host = "127.0.0.1"
port = 9876
auth_token_file = "C:/Users/Administrator/AppData/Local/parrot/token"

[session]
data_dir = "C:/Users/Administrator/AppData/Local/parrot/sessions"
max_history_tokens = 100000
keep_recent_turns = 6

[tools]
shell_allowed = false
file_write_allowed = false
web_allowed = true
max_file_size_mb = 10

[tools.sandbox]
working_dir = "."
allowlist = []
require_confirmation = ["git push", "rm"]

[[providers]]
id = "anthropic"
api_key = "${ANTHROPIC_API_KEY}"
default_model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com/anthropic"
models = ["deepseek-v4-flash", "deepseek-v4-pro"]