[daemon]
host = "127.0.0.1"
# parrotd standalone 默认端口；CLI 自动起子进程时会通过 PARROTD_PORT
# 覆盖为一个随机端口，所以这个值只在手动运行 `parrotd` 时生效。
port = 9876
auth_token_file = "C:/Users/Administrator/AppData/Local/parrot/token"

[session]
data_dir = "C:/Users/Administrator/AppData/Local/parrot/sessions"
max_history_tokens = 100000
keep_recent_turns = 6

[tools]
shell_allowed = false
file_write_allowed = false
web_allowed = true
max_file_size_mb = 10

[tools.sandbox]
working_dir = "."
allowlist = []
require_confirmation = ["git push", "rm"]

# Provider 配置示例：安装后会读到这里。`api_key` 支持 `${ENV_VAR}`
# 占位符，从环境变量读取（推荐：避免把 key 留在磁盘上）。取消下面的
# 注释并按需修改即可使用。
[provider]
id = "anthropic"
protocol = "anthropic"
api_key = "${ANTHROPIC_API_KEY}"
default_model = "claude-sonnet-4-6"
# base_url = "https://api.anthropic.com"
# models = ["claude-sonnet-4-6"]
